events {}
http {

  # ── BoatManager domain ─────────────────────────────────────────
  server {
    listen 80;
    server_name ribmanager.exe-sailing-club.org;

    location = / {
      return 301 $scheme://$host/ribmanager/;
    }

    location = /ribmanager {
      return 301 /ribmanager/;
    }

    location /ribmanager/ {
      proxy_pass         http://localhost:3002/;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_redirect     ~^https?://[^/]+(/.+)$ /ribmanager$1;
      proxy_set_header   Accept-Encoding "";
      sub_filter         'href="/admin'   'href="/ribmanager/admin';
      sub_filter         'action="/admin' 'action="/ribmanager/admin';
      sub_filter_once    off;
    }
  }

  # ── SCM-Tools domain ───────────────────────────────────────────
  server {
    listen 80;
    server_name scm-tools.exe-sailing-club.org;

    location = / {
      return 301 $scheme://$host/scm-tools/;
    }

    location = /scm-tools {
      return 301 /scm-tools/;
    }

    location /scm-tools/ {
      proxy_pass         http://localhost:3001/;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering    off;
      proxy_cache        off;
      proxy_read_timeout 3600s;
      proxy_set_header   Accept-Encoding "";
      sub_filter         '"/api/' '"/scm-tools/api/';
      sub_filter_once    off;
    }
  }

  # ── Main server (mealstock + path-based routing) ───────────────
  server {
    listen 80 default_server;

    location /mealstock {
      proxy_pass         http://localhost:3000;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /admin {
      proxy_pass         http://localhost:3000/mealstock/admin;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /ribmanager {
      return 301 /ribmanager/;
    }

    location /ribmanager/ {
      proxy_pass         http://localhost:3002/;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_redirect     ~^https?://[^/]+(/.+)$ /ribmanager$1;
      proxy_set_header   Accept-Encoding "";
      sub_filter         'href="/admin'   'href="/ribmanager/admin';
      sub_filter         'action="/admin' 'action="/ribmanager/admin';
      sub_filter_once    off;
    }

    location = /scm-tools {
      return 301 /scm-tools/;
    }

    location /scm-tools/ {
      proxy_pass         http://localhost:3001/;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering    off;
      proxy_cache        off;
      proxy_read_timeout 3600s;
      proxy_set_header   Accept-Encoding "";
      sub_filter         '"/api/' '"/scm-tools/api/';
      sub_filter_once    off;
    }

    location = / {
      return 301 /mealstock/;
    }
  }
}
